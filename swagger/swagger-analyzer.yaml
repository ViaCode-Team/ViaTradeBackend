components:
  schemas:
    InstrumentFileResponse:
      required:
        - endDate
        - id
        - startDate
        - symbol
        - timeFrame
      type: object
      properties:
        id:
          type: integer
          format: int32
        symbol:
          type: string
        timeFrame:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
      additionalProperties: false
    ProblemDetails:
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      example:
        type: https://httpstatuses.io/400
        title: Validation Failed
        status: 400
        detail: One or more validation errors occurred.
        instance: /api/trades
        code: validation_failed
        traceId: 0HNABC123:00000001
  securitySchemes:
    ServicePassword:
      type: apiKey
      description: Write service password.
      name: TgBot-Service-Password
      in: header
tags:
  - name: Instruments