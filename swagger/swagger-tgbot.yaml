components:
  schemas:
    DueReminderResult:
      required:
        - id
        - remindAt
        - text
        - userId
      type: object
      properties:
        id:
          type: integer
          format: int32
        text:
          type: string
        remindAt:
          type: string
          format: date-time
        instrument:
          $ref: '#/components/schemas/InstrumentBriefResult'
        userId:
          type: integer
          format: int32
      additionalProperties: false
    InstrumentBriefResult:
      required:
        - id
        - symbol
      type: object
      properties:
        id:
          type: integer
          format: int32
        symbol:
          type: string
        name:
          type: string
      additionalProperties: false
    LinkTelegramCommand:
      required:
        - telegramId
        - telegramToken
      type: object
      properties:
        telegramToken:
          maxLength: 256
          minLength: 1
          type: string
        telegramId:
          maxLength: 64
          minLength: 1
          type: string
      additionalProperties: false
    MarkReminderDeliveredCommand:
      required:
        - reminderId
        - userId
      type: object
      properties:
        userId:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int32
        reminderId:
          minimum: 0
          exclusiveMinimum: true
          type: integer
          format: int32
      additionalProperties: false
    ProblemDetails:
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - traceId
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      example:
        type: https://httpstatuses.io/400
        title: Validation Failed
        status: 400
        detail: One or more validation errors occurred.
        instance: /api/trades
        code: validation_failed
        traceId: 0HNABC123:00000001
  securitySchemes:
    ServicePassword:
      type: apiKey
      description: Write service password.
      name: Service-Password
      in: header
tags:
  - name: Reminders
  - name: Telegram