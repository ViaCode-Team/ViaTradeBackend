components:
  schemas:
    CreateNoteRequest:
      required:
        - noteText
      type: object
      properties:
        noteText:
          type: string
      additionalProperties: false
    CreateTradeRemindRequest:
      required:
        - dateTime
        - textRemind
      type: object
      properties:
        textRemind:
          type: string
        dateTime:
          type: string
          format: date-time
      additionalProperties: false
    CreateTradeRequest:
      required:
        - count
        - dateOpen
        - tradeCodeId
        - tradeOpen
        - tradeSignal
        - tradeTypeId
      type: object
      properties:
        dateOpen:
          type: string
          format: date-time
        dateClose:
          type: string
          format: date-time
        tradeOpen:
          type: number
          format: double
        tradeClose:
          type: number
          format: double
        tradeSignal:
          $ref: '#/components/schemas/TradeSignal'
        count:
          type: integer
          format: int32
        tradeTypeId:
          type: integer
          format: int32
        tradeCodeId:
          type: integer
          format: int32
      additionalProperties: false
    CreateUserStrategyRequest:
      required:
        - strategyId
      type: object
      properties:
        strategyId:
          type: integer
          format: int32
      additionalProperties: false
    CreateUserStrategyTradeCodeRequest:
      required:
        - strategyId
        - tradeCodeId
      type: object
      properties:
        tradeCodeId:
          type: integer
          format: int32
        strategyId:
          type: integer
          format: int32
      additionalProperties: false
    LinkTelegramRequest:
      required:
        - tgId
        - tgToken
      type: object
      properties:
        tgToken:
          type: string
        tgId:
          type: string
      additionalProperties: false
    LoginRequest:
      required:
        - login
        - password
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      additionalProperties: false
    NoteType:
      enum:
        - tradeCodeNote
        - tradeStrategyNote
      type: string
    ProblemDetails:
      required:
        - type
        - status
        - title
        - detail
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
      example:
        type: https://httpstatuses.com/400
        title: Bad Request
        status: 400
        detail: Invalid input parameter
    RegisterRequest:
      required:
        - login
        - password
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      additionalProperties: false
    RemindSortField:
      enum:
        - dateTimeAsc
        - dateTimeDesc
      type: string
    SignalSortField:
      enum:
        - dateTimeAsc
        - dateTimeDesc
        - assetAsc
        - assetDesc
        - accuracyAsc
        - accuracyDesc
      type: string
    StockSortField:
      enum:
        - nameAsc
        - nameDesc
      type: string
    StrategySortField:
      enum:
        - nameAsc
        - nameDesc
        - accuracyAsc
        - accuracyDesc
      type: string
    TradeSignal:
      enum:
        - hold
        - buy
        - sell
      type: string
    TradeStatus:
      enum:
        - open
        - closed
      type: string
    UpdateTradeRemindRequest:
      required:
        - dateTime
        - textRemind
      type: object
      properties:
        textRemind:
          type: string
        dateTime:
          type: string
          format: date-time
      additionalProperties: false
    UpdateTradeRequest:
      required:
        - count
        - dateOpen
        - tradeCodeId
        - tradeOpen
        - tradeSignal
        - tradeTypeId
      type: object
      properties:
        dateOpen:
          type: string
          format: date-time
        dateClose:
          type: string
          format: date-time
        tradeOpen:
          type: number
          format: double
        tradeClose:
          type: number
          format: double
        tradeSignal:
          $ref: '#/components/schemas/TradeSignal'
        count:
          type: integer
          format: int32
        tradeTypeId:
          type: integer
          format: int32
        tradeCodeId:
          type: integer
          format: int32
      additionalProperties: false
