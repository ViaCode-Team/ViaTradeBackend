components:
  schemas:
    CreateUserStrategyRequest:
      type: object
      properties:
        strategyId:
          type: integer
          format: int32
      additionalProperties: false
    LoginRequest:
      required:
        - login
        - password
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      additionalProperties: false
    MeDto:
      required:
        - id
        - lastLoginDate
        - login
      type: object
      properties:
        id:
          type: integer
          format: int32
        login:
          type: string
        lastLoginDate:
          type: string
          format: date-time
        tgId:
          type: string
          nullable: true
      additionalProperties: false
    ProblemDetails:
      required:
        - type
        - status
        - title
        - detail
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
      example:
        type: https://httpstatuses.com/400
        title: Bad Request
        status: 400
        detail: Invalid input parameter
    RegisterRequest:
      required:
        - login
        - password
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      additionalProperties: false
    StrategyData:
      required:
        - name
      type: object
      properties:
        name:
          type: string
        tickers:
          type: array
          items:
            $ref: '#/components/schemas/TickerResults'
      additionalProperties: false
    StrategyResult:
      required:
        - signal
      type: object
      properties:
        date:
          type: string
          format: date-time
        closePrice:
          type: number
          format: double
        signal:
          type: string
      additionalProperties: false
    StrategyResultResponse:
      type: object
      properties:
