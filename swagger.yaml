components:
  schemas:
    CreateNoteRequest:
      required:
        - noteText
      type: object
      properties:
        noteText:
          type: string
      additionalProperties: false
    CreateTradeRemindRequest:
      required:
        - dateTime
        - textRemind
      type: object
      properties:
        textRemind:
          type: string
        dateTime:
          type: string
          format: date-time
      additionalProperties: false
    CreateTradeRequest:
      required:
        - count
        - dateOpen
        - tradeCodeId
        - tradeOpen
        - tradeSignal
        - tradeTypeId
      type: object
      properties:
        dateOpen:
          type: string
          format: date-time
        dateClose:
          type: string
          format: date-time
        tradeOpen:
          type: number
          format: double
        tradeClose:
          type: number
          format: double
        tradeSignal:
          $ref: '#/components/schemas/TradeSignal'
        count:
          type: integer
          format: int32
        tradeTypeId:
          type: integer
          format: int32
        tradeCodeId:
          type: integer
          format: int32
      additionalProperties: false
    CreateUserStrategyRequest:
      required:
        - strategyId
      type: object
      properties:
        strategyId:
          type: integer
          format: int32
