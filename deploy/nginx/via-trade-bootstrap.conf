# Install this HTTP-only configuration before the first Let's Encrypt issuance.
# Replace api.example.com before enabling the configuration.

server {
	listen 80;
	listen [::]:80;
	server_name api.example.com;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 404;
	}
}
