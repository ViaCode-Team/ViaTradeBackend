# This file is included from the `http` block by /etc/nginx/conf.d/*.conf.
# Replace api.example.com before enabling the configuration.

limit_req_zone $binary_remote_addr zone=via_trade_api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=via_trade_auth_per_ip:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=via_trade_connections_per_ip:10m;

upstream via_trade_backend {
	server 127.0.0.1:8080;
	keepalive 32;
}

server {
	listen 80;
	listen [::]:80;
	server_name api.example.com;

	location ^~ /.well-known/acme-challenge/ {
		root /var/www/certbot;
		default_type text/plain;
		try_files $uri =404;
	}

	location / {
		return 308 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name api.example.com;

	ssl_certificate /etc/letsencrypt/live/api.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:ViaTradeSSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	server_tokens off;
	limit_req_status 429;
	limit_conn_status 429;
	client_max_body_size 1m;
	client_body_timeout 10s;
	client_header_timeout 10s;
	keepalive_timeout 65s;
	send_timeout 30s;
	large_client_header_buffers 4 16k;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "DENY" always;
	add_header Referrer-Policy "no-referrer" always;
	add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

	location = /api/v1/users {
		limit_req zone=via_trade_auth_per_ip burst=10 nodelay;
		include /etc/nginx/snippets/via-trade-proxy.conf;
	}

	location = /api/v1/sessions {
		limit_req zone=via_trade_auth_per_ip burst=10 nodelay;
		include /etc/nginx/snippets/via-trade-proxy.conf;
	}

	location = /api/v1/sessions/current/refresh {
		limit_req zone=via_trade_auth_per_ip burst=10 nodelay;
		include /etc/nginx/snippets/via-trade-proxy.conf;
	}

	location ^~ /api/v1/ {
		limit_conn via_trade_connections_per_ip 20;
		limit_req zone=via_trade_api_per_ip burst=40 nodelay;
		include /etc/nginx/snippets/via-trade-proxy.conf;
	}

	location / {
		return 404;
	}
}
